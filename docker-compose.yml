# name: support-agent-ai

services:
  # ---------- 0. Redis (rate limiting) ----------
  redis:
    image: redis:7-alpine
    container_name: support_agent_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ---------- 1. PostgreSQL (latest) ----------
  db:
    image: pgvector/pgvector:pg18
    container_name: support_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ images expect the mount at /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------- 2. Django admin panel ----------
  backend:
    build: ./backend
    container_name: support_agent_admin
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  # ---------- 3. React website (production build served by Nginx) ----------
  frontend:
    build: ./frontend
    container_name: support_agent_frontend
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data: